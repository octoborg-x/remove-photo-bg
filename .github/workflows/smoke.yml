name: smoke

# Free CPU/WASM regression gate (class-2 "no WebGPU device" proxy).
# Software rendering is NOT a GPU: this never produces real WebGPU timings.
#
# Fires only when the change can influence the runtime pipeline it exercises
# (model fetch/load, WASM runtime, in-browser inference, the smoke harness
# itself, or build/dependency config). Doc-only and CI-only edits skip it.
on:
  push:
    branches: [main, staging, production]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'test-images/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/smoke.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'test-images/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/smoke.yml'

jobs:
  wasm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fetch the pinned models into public/ BEFORE build, so vite copies them
      # into dist/ for preview to serve. The models are ~65 + ~94 + ~185 MB and
      # gitignored, so every fresh checkout starts without them.
      - run: npm run fetch-models
      - run: npm run build
      # Fail fast if any model did not survive the build; the preview can't
      # serve what isn't in dist/.
      - name: Verify model artifacts
        run: |
          test -s dist/models/model_512_int8_fp16.onnx
          test -s dist/models/model_512_int0_fp16.onnx
          test -s dist/models/model_512_int0_fp32.onnx
          test -s dist/models-manifest.json
      # puppeteer-core needs an executable at run-smoke's default CHROME_BIN.
      - run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          test -x /usr/bin/chromium
      - name: Run WASM smoke
        shell: bash
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4173 && break
            sleep 1
          done
          # All CI runs force ?provider=wasm to keep results deterministic
          # across software-rendered GitHub-hosted runners.
          # Default (auto-loaded manifest default, model_512_int8_fp16).
          node scripts/run-smoke.mjs "http://localhost:4173/?provider=wasm" --out smoke-results/ci-default
          # Explicit other models; ?model= drives the app's own override.
          node scripts/run-smoke.mjs "http://localhost:4173/?provider=wasm&model=model_512_int0_fp16" --out smoke-results/ci-fp16
          node scripts/run-smoke.mjs "http://localhost:4173/?provider=wasm&model=model_512_int0_fp32" --out smoke-results/ci-fp32
          # Mask adjustments wired from the URL (exercises the load path).
          node scripts/run-smoke.mjs "http://localhost:4173/?provider=wasm&maskThreshold=30&maskFeather=4" --out smoke-results/ci-mask
