<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>remove-photo-bg — before / after gallery</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./gallery.css" />
</head>
<body>
  <header class="page">
    <h1>Before / after gallery — original vs cut-out</h1>
    <p class="meta" id="meta">Loading…</p>
    <div class="controls" id="verdicts"></div>
    <div class="controls" id="filters"></div>
    <div class="controls">
      <label class="toggle">
        <input type="checkbox" id="checker" checked />
        Checkerboard behind cut-outs
      </label>
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer class="page">
    Generated by <code>npm run eval:gallery:2up</code>. Each card shows the source
    photo and the cut-out the current pipeline produced for it, with that image's
    accuracy-benchmark verdict when the run includes a <code>benchmark.json</code>.
  </footer>

  <script type="module" src="./gallery.js"></script>
</body>
</html>
