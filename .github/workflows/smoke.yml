name: smoke

# Free CPU/WASM regression gate (class-2 "no WebGPU device" proxy).
# Software rendering is NOT a GPU: this never produces real WebGPU timings.
on:
  push:
    branches: [main, staging, production]
  pull_request:

jobs:
  wasm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fetch the pinned model into public/ BEFORE build, so vite copies it
      # into dist/ for preview to serve.
      - run: npm run fetch-models
      - run: npm run build
      # puppeteer-core needs an executable at run-smoke's default CHROME_BIN.
      - run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          test -x /usr/bin/chromium
      - name: Run WASM smoke
        shell: bash
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4173 && break
            sleep 1
          done
          node scripts/run-smoke.mjs http://localhost:4173 --out smoke-results/ci
