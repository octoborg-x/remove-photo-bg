<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>remove-photo-bg — evaluation gallery (WASM vs WebGPU)</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="./gallery.css" />
</head>
<body>
  <header class="page">
    <h1>Evaluation gallery — WASM (CPU) vs WebGPU</h1>
    <p class="meta" id="meta">Loading…</p>
    <div class="controls" id="filters"></div>
    <div class="controls">
      <label class="toggle">
        <input type="checkbox" id="checker" checked />
        Checkerboard behind cut-outs
      </label>
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer class="page">
    Generated by <code>npm run eval:gallery</code>. Each card shows the source photo, the
    CPU (WASM) cut-out and the WebGPU cut-out for the same image. Masks are identical
    across backends — WebGPU only changes speed.
  </footer>

  <script type="module" src="./gallery.js"></script>
</body>
</html>
