<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiRefNet_lite Phase 1 — browser smoke test</title>
    <style>
      /* Minimal, plain styling for the Phase 1 smoke-test harness. */
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; }
      img { max-width: 45%; display: inline-block; margin: 0.5rem 0.5rem 0 0; }
      .stage { font-size: 0.9rem; color: #333; }
      canvas { max-width: 45%; border: 1px solid #ccc; }
      button { margin-right: 0.5rem; }
      /* A transparent PNG on a white page looks blank, so show transparency
         against a checkerboard instead. */
      #outputBox img {
        background-color: #fff;
        background-image:
          linear-gradient(45deg, #d0d0d0 25%, transparent 25%),
          linear-gradient(-45deg, #d0d0d0 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #d0d0d0 75%),
          linear-gradient(-45deg, transparent 75%, #d0d0d0 75%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        border: 1px solid #bbb;
      }
      .hint { color: #666; font-size: 0.9rem; margin: 0.25rem 0; }
    </style>
  </head>
  <body>
    <h1>BiRefNet_lite — browser smoke test</h1>
    <p class="stage" id="stage">Starting…</p>
    <p class="hint" id="buildHint">Build <code id="buildStamp">__BUILD_ID__</code> — if this does not match the build you just made, the page is stale; reload with Ctrl+Shift+R.</p>
    <button id="pickFile">Choose image</button>
    <button id="runAll" disabled>Run smoke test</button>
    <button id="copyReport">Copy device report</button>
    <div>
      <strong>Input image</strong>
      <div id="inputBox"></div>
    </div>
    <div>
      <strong>Output (transparent PNG)</strong>
      <div id="outputBox"></div>
    </div>
    <pre id="log"></pre>

    <!-- The worker is loaded as a module worker via Vite. -->
    <script type="module" src="/src/main.ts"></script>
    <script>
      // A page served without Vite's transform (`index.html` opened directly, or
      // through an IDE/static file preview) still contains the literal
      // `__BUILD_ID__` placeholder and cannot load `/src/main.ts`. Say that plainly
      // instead of showing a raw token and a generic "script did not run".
      (function () {
        // The token is assembled at runtime so the transform that substitutes it
        // cannot also substitute this copy.
        var placeholder = '__BUILD' + '_ID__';
        var stamp = document.getElementById('buildStamp');
        if (!stamp || stamp.textContent.indexOf(placeholder) === -1) {
          // Transformed by Vite: normal path. Watch for an entry point that never
          // executes (404 on main.ts, or a module that throws while evaluating).
          setTimeout(function () {
            var log = document.getElementById('log');
            if (log && !log.textContent) {
              document.getElementById('stage').textContent =
                'App script did not run — open the browser console and check that /src/main.ts is served';
            }
          }, 8000);
          return;
        }

        stamp.textContent = 'none';
        var stage = document.getElementById('stage');
        var hint = document.getElementById('buildHint');
        stage.textContent = 'This page was opened without the dev server';

        // The sandbox forwards each port to its own hostname: `work-1-<id>` is
        // port 12000, `work-2-<id>` is 12001. Opening any other one (or a preview
        // pane) serves this file raw, so send the reader to the app on 12000.
        var forwarded = location.hostname.match(/^work-\d+-([a-z0-9]+)\.prod-runtime\.all-hands\.dev$/);
        if (forwarded && location.hostname.indexOf('work-1-') !== 0) {
          var appUrl = 'https://work-1-' + forwarded[1] + '.prod-runtime.all-hands.dev/';
          stage.textContent = 'Moving you to the app on port 12000…';
          hint.innerHTML = '';
          var link = document.createElement('a');
          link.href = appUrl;
          link.textContent = appUrl;
          hint.appendChild(document.createTextNode('If nothing happens, open '));
          hint.appendChild(link);
          hint.appendChild(document.createTextNode('.'));
          location.replace(appUrl);
          return;
        }

        hint.innerHTML = '';
        hint.appendChild(
          document.createTextNode(
            'index.html was served as a plain file, so the TypeScript entry point cannot load. ' +
              'Start the dev server and open the URL it prints instead of the file: ',
          ),
        );
        var code = document.createElement('code');
        code.textContent = 'npm run dev';
        hint.appendChild(code);
        hint.appendChild(
          document.createTextNode(
            ' (sets port 12000). On a remote sandbox use the https URL that forwards port 12000, not localhost.',
          ),
        );
      })();
    </script>
  </body>
</html>
