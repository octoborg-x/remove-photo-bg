name: deploy

# Branch model:
#   staging    -> preview deployment (every push)
#   production -> production deployment (only this branch, so pushes to main do
#                 not trigger a production re-deploy)
# Set "production" as the project's production branch and "staging" as a preview
# branch in the Cloudflare Pages settings; --branch maps the Git branch onto
# Cloudflare's so Direct Upload and Git deploys agree.
#
# Until the Cloudflare/R2 secrets are configured the job no-ops with a notice
# instead of failing, so the branches stay green before the account exists.
on:
  push:
    branches: [staging, production]
  workflow_dispatch:

concurrency:
  # One deploy per branch at a time; a newer push supersedes an in-flight one.
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      VITE_ASSET_BASE: ${{ vars.VITE_ASSET_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check Cloudflare credentials
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Deploy skipped::Cloudflare secrets are not configured yet."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # The model + WASM runtime are gitignored and are not part of the site
      # bundle; fetch them here so they can be pushed to R2.
      - if: steps.guard.outputs.configured == 'true'
        run: npm run fetch-models

      # Idempotent: objects whose checksum already matches are skipped.
      - name: Upload assets to R2
        if: steps.guard.outputs.configured == 'true'
        run: |
          npm i --no-save @aws-sdk/client-s3
          npm run upload-assets

      # Small static site; the large binaries are stripped from dist/ (the WASM
      # runtime is served by the Pages Function from R2 instead).
      - name: Build site
        if: steps.guard.outputs.configured == 'true'
        run: npm run build:site

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.configured == 'true'
        run: |
          npx wrangler@3 pages deploy dist \
            --project-name=remove-photo-bg \
            --branch="${{ github.ref_name }}"
