name: branch-flow-guard

# Enforces the release flow by rejecting pull requests that merge into
# staging/production from a disallowed source branch:
#   main       -> staging      (preview)
#   main,staging -> production (prod)
# It is a required status check on staging and production via a ruleset.

on:
  pull_request:
    branches: [staging, production]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The guard compares branch ancestry, so the allowed and source
          # branches must be present locally.
          ref: ${{ github.head_ref }}
      - name: Fetch allowed branches
        shell: bash
        run: |
          git fetch origin --depth=1 main staging production
      - name: Check source branch against target
        shell: bash
        env:
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
        run: |
          allowed=""
          case "$TARGET" in
            production)
              allowed="main staging"
              ;;
            staging)
              # staging only receives from main (or a branch derived from it)
              allowed="main"
              ;;
            *)
              # not a protected target: allow
              echo "Target $TARGET not protected; passing."
              exit 0
              ;;
          esac
          ok=no
          for a in $allowed; do
            if [ "$SOURCE" = "$a" ]; then ok=yes; fi
            # A branch derived from an allowed branch (e.g. a prepared merge or
            # a feature branch based on it) keeps the flow enforced while
            # letting the usual promote/backport branches through.
            # checkout fetched the head with fetch-depth: 0, so origin/$SOURCE
            # exists for any real PR; skip ancestry if it is somehow missing so
            # a non-derived branch is not accidentally let through.
            src_ref="origin/$SOURCE"
            if git rev-parse --verify "$src_ref" >/dev/null 2>&1 &&
               git merge-base --is-ancestor "origin/$a" "$src_ref" 2>/dev/null; then
              ok=yes
            fi
          done
          if [ "$ok" = yes ]; then
            echo "Allowed: $TARGET may receive from $SOURCE (wanted [$allowed])."
          else
            echo "Blocked: $TARGET may only receive from [$allowed]; got PR from $SOURCE."
            exit 1
          fi